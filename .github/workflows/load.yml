name: Encord → BigQuery

on:
  schedule:
    - cron: "0 14 * * *"     # daily at 7:30 PM IST (14:00 UTC)
  workflow_dispatch:         # manual trigger

jobs:
  load:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encord-looker-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Write GCP key to disk
        run: echo "$GCP_SA_KEY" > /tmp/gcp-key.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Write Encord SSH key to disk
        run: |
          echo "$ENCORD_SSH_KEY" > /tmp/encord_key
          chmod 600 /tmp/encord_key
        env:
          ENCORD_SSH_KEY: ${{ secrets.ACC_ENCORD_SSH_KEY }}

      - name: Run loader
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
          ENCORD_SSH_KEY_PATH: /tmp/encord_key
          ENCORD_DOMAIN: https://api.encord.com
          GCP_PROJECT: encord-accelerate
          BQ_DATASET: encord_metrics
        run: python load_encord_metrics.py
